
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 80px 20px;
      background: #f1f5f9;
      color: #1e293b;
    }

    .card {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
      background: white;
      border-radius: 16px;
    }

    button {
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>My website is ready for GitHub Pages.</p>
    <button onclick="alert('Website is working!')">
      Click Me
    </button>
  </div>
</body>
</html>
